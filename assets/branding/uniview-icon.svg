<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112" />
    </clipPath>
  </defs>
  <!-- Background squircle -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="#2563eb" />
  
  <!-- Stylised eye aperture (two overlapping circular arcs) -->
  <path d="M 80 256 A 185 185 0 0 1 432 256 A 185 185 0 0 1 80 256 Z" fill="#ffffff" />
  
  <!-- Central pupil / lens -->
  <circle cx="256" cy="256" r="54" fill="#2563eb" />
  
  <!-- Specular glint / highlight -->
  <circle cx="276" cy="236" r="16" fill="#ffffff" />
</svg>
